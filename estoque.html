<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Estoque · {{APP}}</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#0b1120;--pn:#111827;--pn2:#1f2937;--bd:rgba(148,163,184,.22);--tx:#e5e7eb;--mu:#94a3b8;--ac:#3b82f6;--ok:#22c55e;--av:#f59e0b;--er:#ef4444;--hl:rgba(59,130,246,.18)}
@media (prefers-color-scheme:light){:root:not([data-tema="escuro"]){--bg:#f1f5f9;--pn:#ffffff;--pn2:#f8fafc;--bd:rgba(15,23,42,.14);--tx:#0f172a;--mu:#64748b;--ac:#2563eb;--hl:rgba(37,99,235,.12)}}
:root[data-tema="claro"]{--bg:#f1f5f9;--pn:#ffffff;--pn2:#f8fafc;--bd:rgba(15,23,42,.14);--tx:#0f172a;--mu:#64748b;--ac:#2563eb;--hl:rgba(37,99,235,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--ac)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--bd)}
.lin1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:18px;font-weight:700}
.sub{color:var(--mu);font-size:12px}
.sp{flex:1}
.bt{appearance:none;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:9px;padding:7px 11px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.bt:hover{border-color:var(--ac)}
.bt.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.bt[disabled]{opacity:.55;cursor:default}
.busca{margin-top:10px;display:flex;gap:8px}
.busca input{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);outline:none}
.busca input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--hl)}
/* Campo de busca com "X" próprio: o nativo do type=search não aparece no
   iPhone nem em vários celulares Android. */
.campo{position:relative;flex:1;min-width:0;display:flex}
.campo input{width:100%;padding-right:46px}
.campo input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.limpar{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--mu,#94a3b8);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.limpar:hover,.limpar:focus-visible{color:var(--tx);background:var(--hl)}
.limpar[hidden]{display:none}
.fil{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fil select,.fil label{font:inherit;font-size:13px;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:5px 8px}
.fil label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.res{position:sticky;top:var(--hTopo,0px);z-index:4;background:var(--bg);padding:7px 16px;color:var(--mu);font-size:13px;border-bottom:1px solid var(--bd);line-height:1.6}
.res .p{white-space:nowrap}.res .p+.p::before{content:" · ";white-space:normal}
.topo{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.topo.on{opacity:1;transform:none;pointer-events:auto}
.res b{color:var(--tx)}
.aviso{margin:8px 16px;padding:10px 12px;border-radius:10px;background:rgba(245,158,11,.14);color:var(--av);display:none}
.erro{background:rgba(239,68,68,.14);color:var(--er)}
.wrap{padding:0 16px 90px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--pn);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{position:sticky;top:0;background:var(--pn2);font-size:12px;color:var(--mu);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hl)}
tbody tr:last-child td{border-bottom:0}
.num{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:13px}
.neg{color:var(--er);font-weight:700}.zero{color:var(--mu)}.pos{color:var(--ok);font-weight:600}
.inat{opacity:.55}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid var(--bd);color:var(--mu);margin-left:6px}
mark{background:rgba(250,204,21,.35);color:inherit;border-radius:3px;padding:0 1px}
.mais{display:block;margin:14px auto;min-width:220px}
[hidden]{display:none!important}
.vazio{padding:40px 16px;text-align:center;color:var(--mu)}
.cust{display:none}.comCusto .cust{display:table-cell}
/* Celular: cartões */
@media (max-width:720px){
  .top{padding:10px 12px 8px;position:static}.wrap{padding:0 10px 90px}.res{padding:6px 12px;font-size:12.5px}
  table,thead,tbody,tr,td{display:block}thead{display:none}table{background:none;border:0}
  tbody tr{background:var(--pn);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
  td{border:0;padding:0}
  td.c-desc{grid-row:1;grid-column:1/3;font-weight:600;font-size:15px}
  td.c-cod{grid-row:2;grid-column:1}td.c-cod::before{content:"Cód. ";color:var(--mu);font-family:inherit}
  td.c-qtd{grid-row:2;grid-column:2;text-align:right}td.c-qtd::before{content:"Estoque ";color:var(--mu);font-weight:400}
  td.c-bar{grid-row:3;grid-column:1;color:var(--mu);overflow:hidden;text-overflow:ellipsis}
  td.c-pre{grid-row:3;grid-column:2;text-align:right;font-weight:600}
  td.c-un,td.c-grp{display:none}
  .comCusto td.cust{display:block;grid-row:4;grid-column:2;text-align:right;color:var(--mu)}.comCusto td.cust::before{content:"Custo ";}
}
/* Detalhe */
.ov{position:fixed;inset:0;background:rgba(2,6,23,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.ov.on{display:flex}
.md{background:var(--pn);border:1px solid var(--bd);border-radius:16px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.md header{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:flex-start}
.md header h2{margin:0;font-size:16px;flex:1;word-break:break-word}
.md .cp{padding:12px 16px;overflow:auto}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:4px 12px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.kv .k{color:var(--mu);font-size:12px;word-break:break-word}.kv .v{word-break:break-word;white-space:pre-wrap}
.dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.dest div{background:var(--pn2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.dest small{display:block;color:var(--mu);font-size:11px}.dest b{font-size:16px;word-break:break-all}
.copiar{font-size:11px;margin-left:6px;padding:2px 6px;border-radius:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#e2e8f0;padding:9px 14px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:30;display:none}
@media print{.top .bt,.fil,.busca,.mais,#__off_chip{display:none!important}}
/* ===== Leitor de código de barras (visual do Controle de Vencimento) ===== */
.bt-ler{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:0 14px}
.bt-ler svg{flex:none}
@media (max-width:720px){.bt-ler span{display:none}.bt-ler{padding:0 12px}}
.ovL{position:fixed;inset:0;background:rgba(2,6,23,.72);display:none;align-items:center;justify-content:center;z-index:25;padding:12px}
.ovL.on{display:flex}
.mdL{background:var(--pn);border:1px solid var(--bd);border-radius:16px;width:min(560px,100%);max-height:94vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mdL header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.mdL header h2{margin:0;font-size:16px;flex:1;display:flex;align-items:center;gap:8px}
.leitor-area{position:relative;background:#000;aspect-ratio:4/3;overflow:hidden;touch-action:manipulation}
#leitorVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.leitor-mira{position:absolute;left:7%;right:7%;top:31%;bottom:31%;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.92);pointer-events:none;transition:border-color .15s ease,box-shadow .15s ease}
.leitor-laser{position:absolute;left:10px;right:10px;top:50%;height:2px;border-radius:2px;background:#ff4d4d;box-shadow:0 0 12px #ff4d4d;animation:varrer 1.6s ease-in-out infinite}
@keyframes varrer{0%,100%{transform:translateY(-28px)}50%{transform:translateY(28px)}}
.leitor-area.lido .leitor-mira{border-color:#22c55e;box-shadow:0 0 0 9999px rgba(0,0,0,.42),0 0 0 4px rgba(34,197,94,.45)}
.leitor-area.lido .leitor-laser{background:#22c55e;box-shadow:0 0 12px #22c55e;animation:none}
.leitor-status{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font-size:12.5px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.leitor-controles{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column-reverse;gap:10px;z-index:2}
.btn-redondo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .15s}
.btn-redondo:active{transform:scale(.94)}
.btn-redondo[aria-pressed="true"]{background:#facc15;border-color:#facc15;color:#1a1400;box-shadow:0 0 18px rgba(250,204,21,.55)}
.btn-redondo.indisponivel{opacity:.5}
#btnFoco[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.leitor-zoom{position:absolute;left:12px;bottom:18px;right:72px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.leitor-zoom[hidden]{display:none}
.zoom-passo{display:grid;place-items:center;flex:none;width:34px;height:34px;margin:-6px;border:0;border-radius:50%;background:transparent;color:inherit;cursor:pointer}
.leitor-zoom input{flex:1;min-width:0;accent-color:#fff;height:20px}
.foco-painel{position:absolute;right:70px;bottom:12px;z-index:3;width:min(270px,calc(100% - 94px));max-height:calc(100% - 24px);overflow-y:auto;padding:12px;border-radius:16px;background:rgba(12,14,22,.86);border:1px solid rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.foco-painel[hidden]{display:none}
.foco-titulo{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.foco-modos{display:flex;flex-wrap:wrap;gap:6px}
.foco-modo{flex:1 1 auto;min-height:38px;padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.foco-modo[aria-checked="true"]{background:var(--ac);border-color:var(--ac)}
.foco-ajuste{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px}
.foco-ajuste input{flex:1;min-width:0}
.foco-dica{margin:10px 0 0;font-size:12px;opacity:.75}
.foco-anel{position:absolute;z-index:2;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid #facc15;border-radius:12px;pointer-events:none;animation:focoAnel .9s ease-out forwards}
.foco-anel.sem-suporte{border-color:rgba(255,255,255,.7)}
@keyframes focoAnel{0%{opacity:0;transform:scale(1.5)}25%{opacity:1;transform:scale(1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.92)}}
.leitor-rodape{display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px}
.leitor-rodape .dica{font-size:13px;color:var(--mu);text-align:center;margin:0}
.leitor-rodape .bt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
#btnFotoCodigo.destaque{background:var(--ac);border-color:var(--ac);color:#fff}
@media (max-width:720px){.leitor-area{aspect-ratio:1/1}.leitor-mira{left:6%;right:6%;top:34%;bottom:34%}}
@media (prefers-reduced-motion:reduce){.leitor-laser,.foco-anel{animation:none}}
</style>
</head>
<body>
<div class="top">
  <div class="lin1">
    <h1>Estoque</h1>
    <span class="sub" id="origem">carregando...</span>
    <span class="sp"></span>
    <button class="bt" id="bCsv" title="Baixar todos os resultados da busca (Excel/CSV)">Exportar</button>
    <button class="bt" id="bRec" title="Ler o estoque de novo">Recarregar</button>
    <a class="bt" href="/" id="bVolta">Relatório</a>
  </div>
  <div class="busca">
    <div class="campo">
      <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="Nome, código, código de barras, referência, fornecedor..." aria-label="Pesquisar no estoque">
      <button type="button" class="limpar" id="bLimpar" hidden title="Limpar a busca" aria-label="Limpar a busca"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <button type="button" class="bt pri bt-ler" id="bLer" hidden title="Ler o código de barras com a câmera"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 7v10"/><path d="M12 7v10"/><path d="M17 7v10"/></svg><span>Ler código</span></button>
  </div>
  <div class="fil">
    <select id="fEst" aria-label="Filtro de estoque">
      <option value="todos">Todo o estoque</option>
      <option value="com">Com estoque</option>
      <option value="sem">Sem estoque (zero)</option>
      <option value="negativo">Estoque negativo</option>
      <option value="abaixo">Abaixo do mínimo</option>
    </select>
    <select id="fOrd" aria-label="Ordem">
      <option value="">Mais relevantes</option>
      <option value="descricao">Nome (A–Z)</option>
      <option value="codigo">Código</option>
      <option value="qtd">Maior estoque</option>
      <option value="qtdAsc">Menor estoque</option>
      <option value="preco">Maior preço</option>
      <option value="precoAsc">Menor preço</option>
    </select>
    <label title="Marcado: acha o texto em qualquer parte (ex.: “ato” acha “GATO”). Desmarcado: só itens que começam com o texto (descrição, código, barras...)."><input type="checkbox" id="fCon"> Contém</label>
    <label><input type="checkbox" id="fAtv"> Só ativos</label>
    <label><input type="checkbox" id="fCus"> Mostrar custo</label>
  </div>
</div>
<div class="res" id="res" aria-live="polite"></div>
<div class="aviso" id="aviso"></div>
<div class="wrap" id="wrap">
  <table id="tab" hidden>
    <thead><tr>
      <th data-o="codigo">Código</th><th data-o="descricao">Descrição</th><th>Cód. barras / Ref.</th>
      <th data-o="qtd" class="num">Estoque</th><th>Un</th><th data-o="preco" class="num">Preço</th><th class="num cust">Custo</th><th>Grupo</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="vazio" id="vazio" hidden></div>
  <button class="bt mais" id="bMais" hidden>Carregar mais</button>
</div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="mdT">
  <div class="md">
    <header><h2 id="mdT">Item</h2><button class="bt" id="mdX" aria-label="Fechar">Fechar</button></header>
    <div class="cp" id="mdC"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<!-- Leitor de código de barras (do projeto Controle de Vencimento: leitor/leitor.js) -->
<div class="ovL" id="ovLeitor" role="dialog" aria-modal="true" aria-labelledby="tituloLeitor">
  <div class="mdL">
    <header><h2 id="tituloLeitor"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 7v10"/><path d="M12 7v10"/><path d="M17 7v10"/></svg>Ler código de barras</h2><button type="button" class="bt" id="btnFecharLeitor" aria-label="Fechar">Fechar</button></header>
    <div class="leitor-area" id="leitorArea">
      <video id="leitorVideo" playsinline muted autoplay aria-label="Imagem da câmera"></video>
      <div class="leitor-mira" id="leitorMira" aria-hidden="true"><span class="leitor-laser"></span></div>
      <p id="leitorStatus" class="leitor-status" role="status">Iniciando câmera…</p>
      <div class="foco-painel" id="painelFoco" hidden></div>
      <div class="leitor-controles">
        <button type="button" class="btn-redondo" id="btnFoco" aria-pressed="false" aria-controls="painelFoco" title="Foco" aria-label="Opções de foco" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg></button>
        <button type="button" class="btn-redondo" id="btnFlash" aria-pressed="false" title="Ligar flash" aria-label="Ligar flash"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6c0 2-2 2-2 4v10a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V10c0-2-2-2-2-4V2h12z"/><line x1="6" x2="18" y1="6" y2="6"/><line x1="12" x2="12" y1="12" y2="12"/></svg></button>
        <button type="button" class="btn-redondo" id="btnTrocarCamera" title="Trocar câmera" aria-label="Trocar câmera" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><circle cx="12" cy="12" r="3"/><path d="m18 22-3-3 3-3"/><path d="m6 2 3 3-3 3"/></svg></button>
      </div>
      <div class="leitor-zoom" id="leitorZoomCaixa" hidden>
        <button type="button" class="zoom-passo" data-zoom="-1" title="Diminuir zoom" aria-label="Diminuir zoom"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg></button>
        <input type="range" id="leitorZoom" min="1" max="5" step="0.1" value="1" aria-label="Zoom da câmera">
        <button type="button" class="zoom-passo" data-zoom="1" title="Aumentar zoom" aria-label="Aumentar zoom"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/><line x1="11" x2="11" y1="8" y2="14"/></svg></button>
      </div>
    </div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  var aplicarCusto = function () { document.body.classList.toggle("comCusto", $("fCus").checked); };

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  // Destaca os termos pesquisados (sem acento/maiúsculas), escapando o resto.

<script type="module">
/* Leitor de código de barras do projeto Controle de Vencimento (leitor/leitor.js):
   câmera ao vivo quando o navegador permite (página segura: o próprio computador
   ou https); senão, "Tirar foto do código" (abre a câmera do celular e lê da foto). */
import { criarLeitor } from "/leitor/leitor.js";
import { ligarInterfaceFoco } from "/leitor/foco.js";

const $ = id => document.getElementById(id);
const el = {
  bLer: $("bLer"), ov: $("ovLeitor"), area: $("leitorArea"), video: $("leitorVideo"), mira: $("leitorMira"), status: $("leitorStatus"),
  flash: $("btnFlash"), trocar: $("btnTrocarCamera"), foco: $("btnFoco"), painelFoco: $("painelFoco"),
  zoomCaixa: $("leitorZoomCaixa"), zoom: $("leitorZoom"), foto: $("btnFotoCodigo"), arquivo: $("arquivoFotoCodigo"), fechar: $("btnFecharLeitor")
};
const aviso = m => { try { window.__estoqueAviso(String(m).replace(/<[^>]+>/g, "")); } catch (_) {} };
const cameraAoVivo = () => !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
let leitor = null, concluida = false, uiFoco = null;
// Endereço HTTPS do sistema (porta 7736): lá o navegador libera a câmera ao vivo.
// Buscado já ao abrir a página: no toque em "Ler código" a decisão é imediata
// (o iPhone só abre a câmera/foto se for no próprio toque).
let enderecoSeguro = null;
if (!cameraAoVivo()) {
  fetch("/api/https", { cache: "no-store" }).then(r => r.ok ? r.json() : null)
    .then(d => { if (d && d.ok && d.url && /^https:\/\/[a-z0-9.-]+:\d+$/i.test(d.url)) enderecoSeguro = d; })
    .catch(() => {});
}
function irParaSeguro() {
  if (!enderecoSeguro) return false;
  if (!enderecoSeguro.confiavel && !confirm("O leitor ao vivo precisa da conexão segura (HTTPS) do sistema.\n\nNa primeira vez o celular mostra um aviso de certificado: toque em \"Avançado\" / \"Mostrar detalhes\" e depois em \"Continuar\" / \"Visitar site\". É o certificado do próprio sistema, da sua rede.\n\nAbrir o leitor ao vivo agora? (Cancelar = tirar uma foto do código)")) return false;
  const q = ($("q") && $("q").value) || "";
  location.href = enderecoSeguro.url + "/estoque?ler=1" + (q ? "&q=" + encodeURIComponent(q) : "");
  return true;
}

function obterLeitor() {
  if (leitor) return leitor;
  leitor = criarLeitor({
    video: el.video, mira: el.mira,
    aoLer: codigo => lido(codigo),
    aoStatus: t => { el.status.textContent = t; },
    aoCapacidades: cap => {
      el.flash.classList.toggle("indisponivel", !cap.flash);
      el.flash.setAttribute("aria-pressed", String(!!cap.flashLigado));
      el.flash.title = !cap.flash ? "Flash indisponível neste aparelho/navegador" : cap.flashLigado ? "Desligar flash" : "Ligar flash";
      el.trocar.hidden = cap.cameras < 2;
      el.zoomCaixa.hidden = !cap.zoom;
      if (cap.zoom) { el.zoom.min = cap.zoom.min; el.zoom.max = cap.zoom.max; el.zoom.step = cap.zoom.passo; el.zoom.value = cap.zoom.valor; }
      uiFoco?.atualizar();
    }
  });
  return leitor;
}

function fechar() {
  leitor?.parar();
  uiFoco?.fecharPainel();
  el.foco.hidden = true;
  el.ov.classList.remove("on");
}

function lido(codigo) {
  if (concluida) return;
  const limpo = String(codigo || "").replace(/\s+/g, "").slice(0, 64);
  if (!limpo) return;
  concluida = true;
  el.area.classList.add("lido");
  el.status.textContent = "Lido: " + limpo;
  setTimeout(() => { fechar(); window.__estoqueBuscarCodigo(limpo); }, 350);
}

async function abrir() {
  // Sem câmera ao vivo (página http na rede): vai direto para a foto — um clique só.
  if (!cameraAoVivo()) {
    if (irParaSeguro()) return;
    aviso("Nesta conexão o navegador não libera a câmera ao vivo: tire uma foto do código.");
    el.arquivo.click();
    return;
  }
  concluida = false;
  el.area.classList.remove("lido");
  el.foto.classList.remove("destaque");
  el.status.textContent = "Iniciando câmera…";
  el.flash.setAttribute("aria-pressed", "false");
  el.flash.classList.remove("indisponivel");
  el.trocar.hidden = true;
  el.zoomCaixa.hidden = true;
  el.foco.hidden = true;
  el.ov.classList.add("on");
  const l = obterLeitor();
  try {
    await l.iniciar();
    if (!el.ov.classList.contains("on")) l.parar();
  } catch (erro) {
    l.parar();
    if (!el.ov.classList.contains("on")) return;
    const { mensagem } = l.traduzirErro(erro);
    el.status.textContent = "Câmera indisponível — use “Tirar foto do código”";
    el.foto.classList.add("destaque");
    aviso(mensagem);
  }
}

async function lerFoto(arquivo) {
  if (!arquivo) return;
  const naJanela = el.ov.classList.contains("on");
  if (naJanela) el.status.textContent = "Analisando foto…"; else aviso("Analisando a foto…");
  try {
    const r = await obterLeitor().lerFoto(arquivo);
    if (r && r.codigo) { concluida = false; if (naJanela) lido(r.codigo); else window.__estoqueBuscarCodigo(String(r.codigo).replace(/\s+/g, "").slice(0, 64)); }
    else { if (naJanela) el.status.textContent = leitor?.ativo ? "Procurando código…" : "Nenhum código na foto"; aviso("Não encontrei um código na foto. Tire outra bem de perto, com o código nítido e reto."); }
  } catch (e) {
    console.warn("[leitor]", e);
    aviso("Não foi possível analisar a foto.");
  }
}

uiFoco = ligarInterfaceFoco({ area: el.area, video: el.video, botao: el.foco, painel: el.painelFoco, obterFoco: () => leitor?.foco || null, podeTocar: () => !!leitor?.ativo, aviso: (t, m) => aviso(m) });
el.bLer.addEventListener("click", abrir);
el.fechar.addEventListener("click", fechar);
el.ov.addEventListener("click", e => { if (e.target === el.ov) fechar(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && el.ov.classList.contains("on")) { e.stopPropagation(); fechar(); } }, true);
el.flash.addEventListener("click", async () => {
  if (!leitor?.ativo) return;
  try { await leitor.alternarFlash(); }
  catch { el.flash.classList.add("indisponivel"); aviso("Este aparelho/navegador não permite ligar o flash pela página. Use “Tirar foto do código” com o flash da câmera."); }
});
el.trocar.addEventListener("click", async () => { if (!(await leitor?.trocarCamera())) aviso("Só há uma câmera disponível."); });
let zTmr = null;
el.zoom.addEventListener("input", () => { clearTimeout(zTmr); zTmr = setTimeout(() => leitor?.definirZoom(el.zoom.value), 60); });
el.zoomCaixa.querySelectorAll("[data-zoom]").forEach(b => b.addEventListener("click", () => {
  const passo = Number(el.zoom.step) || 0.1, novo = Math.min(Number(el.zoom.max), Math.max(Number(el.zoom.min), Number(el.zoom.value) + Number(b.dataset.zoom) * Math.max(passo, (Number(el.zoom.max) - Number(el.zoom.min)) / 10)));
  el.zoom.value = String(novo); leitor?.definirZoom(novo);
}));
el.foto.addEventListener("click", () => el.arquivo.click());
el.arquivo.addEventListener("change", () => { const a = el.arquivo.files && el.arquivo.files[0]; el.arquivo.value = ""; lerFoto(a); });
// Botão só aparece quando o leitor carregou (navegador com suporte a módulos).
el.bLer.hidden = false;
// Veio do http com "?ler=1": abre o leitor ao vivo direto.
try {
  const u = new URL(location.href);
  if (u.searchParams.get("ler") === "1") {
    u.searchParams.delete("ler"); history.replaceState(null, "", u.toString());
    if (cameraAoVivo()) setTimeout(abrir, 300);
  }
} catch (_) {}
</script>
</body>
</html>
